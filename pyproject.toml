[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "burgee"
version = "0.1.0a1"
description = "Reference implementation of Burgee, the open robot proximity protocol: BLE identity beacons and an A2A handshake between robots that share no network."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "The Burgee Protocol Authors" }]
keywords = ["robotics", "bluetooth", "ble", "a2a", "agent", "protocol", "interoperability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "cryptography>=42",
  "cbor2>=5.6",
  "jcs>=0.2",
]

[project.optional-dependencies]
ble = [
  "bleak>=0.22",
  "bluez-peripheral>=0.1.8",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
burgee = "burgee.cli:main"

[project.urls]
Homepage = "https://github.com/burgee-protocol/burgee"
Specification = "https://github.com/burgee-protocol/spec"
Issues = "https://github.com/burgee-protocol/burgee/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/burgee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
